name: Tauri Build

on:
  push:
    branches: [main, v3-pilot]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tauri-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - runner: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust dependency cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Backend dependencies and regressions
        run: |
          npm ci
          npm run check
          npm test

      - name: Launcher browser regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node test/launcher-browser.cjs 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/context-browser.cjs 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/context-browser.cjs 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' --ide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package native application
        id: package
        run: node scripts/package.cjs --target ${{ matrix.target }}

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Standard Workflow Test Suite
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: EasyAntigravity-${{ steps.package.outputs.version }}-${{ steps.package.outputs.edition }}-standard-workflow-test-suite
          path: |
            test/
            core/
            features/
            adapters/
            desktop/
            ui/
            scripts/
            src-tauri/src/main.rs
            src-tauri/capabilities/
            src-tauri/tauri.conf.json
            dicts/
            assets/*.png
            package.json
            package-lock.json
            update-manifest.json
            server.js
            index.html
            THIRD-PARTY-NOTICES.md
            README.md
          retention-days: 14

      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ matrix.name }}
          path: |
            src-tauri/Cargo.lock
            src-tauri/tauri.conf.json
          retention-days: 14
